name: Temporary PR56 Formatter

on:
  push:
    branches:
      - feat/vendor-product-category-v2-20260928

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format PR 56 files
        run: >-
          npx prettier --write
          docs/DESIGN_SYSTEM.md
          docs/FUNCTIONAL_SPEC.md
          docs/TESTING_QA.md
          docs/UI_INTERACTION_AUDIT.md
          src/features/vendor/VendorScreens.tsx
      - name: Remove temporary workflow and commit formatting
        run: |
          rm .github/workflows/temporary-pr56-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DESIGN_SYSTEM.md docs/FUNCTIONAL_SPEC.md docs/TESTING_QA.md docs/UI_INTERACTION_AUDIT.md src/features/vendor/VendorScreens.tsx .github/workflows/temporary-pr56-format.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git commit -m "chore: format product category changes"
          git push origin HEAD:feat/vendor-product-category-v2-20260928
