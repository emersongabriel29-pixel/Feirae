name: Temporary Prettier Repair

on:
  push:
    branches:
      - fix/brand-mobile-cards-native-map-cart

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format the two failing files
        run: npx prettier --write src/components/InAppNavigation.tsx src/features/customer/CustomerScreens.tsx
      - name: Remove temporary workflow and commit formatted files
        run: |
          rm .github/workflows/temporary-prettier-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/InAppNavigation.tsx src/features/customer/CustomerScreens.tsx .github/workflows/temporary-prettier-repair.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git commit -m "chore: format PR 53 with Prettier"
          git push origin HEAD:fix/brand-mobile-cards-native-map-cart
