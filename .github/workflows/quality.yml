name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show CustomerScreens Prettier diff
        run: |
          npx prettier --write src/features/customer/CustomerScreens.tsx
          git diff -- src/features/customer/CustomerScreens.tsx
          exit 1
      - run: npm run check
      - run: npm run format:check
