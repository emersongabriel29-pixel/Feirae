name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Autoformat multi-bank branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/multibanca-operacional-v3'
        run: |
          npx prettier --write docs/IMPLEMENTATION_TRACEABILITY.md docs/TESTING_QA.md src/domain/orderBridge.ts src/features/customer/CustomerScreens.tsx
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/IMPLEMENTATION_TRACEABILITY.md docs/TESTING_QA.md src/domain/orderBridge.ts src/features/customer/CustomerScreens.tsx
            git commit -m "style: format final multi-bank changes"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: npm run check
      - name: Verify project synchronization
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check:sync
      - run: npm run format:check
