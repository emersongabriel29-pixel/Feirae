name: Temporary PR54 Docs Formatter

on:
  push:
    branches:
      - fix/gps-select-fallback-20260928

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format documentation
        run: npx prettier --write docs/DESIGN_SYSTEM.md docs/UI_INTERACTION_AUDIT.md docs/TESTING_QA.md
      - name: Remove temporary workflow and commit formatting
        run: |
          rm .github/workflows/temporary-pr54-docs-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DESIGN_SYSTEM.md docs/UI_INTERACTION_AUDIT.md docs/TESTING_QA.md .github/workflows/temporary-pr54-docs-format.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git commit -m "chore: format PR 54 documentation"
          git push origin HEAD:fix/gps-select-fallback-20260928
